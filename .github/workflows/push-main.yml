name: push-main
on:
    push:
        branches: ['main']
jobs:
    call-build:
        uses: ./.github/workflows/workflow-build.yml
        with:
            pyver: '3.11'
            os: 'ubuntu-latest'
    call-test:
        needs: [call-build]
        uses: ./.github/workflows/workflow-test.yml
        with:
            pyver: '3.11'
            os: 'ubuntu-latest'
    call-pages:
        needs: [call-build]
        uses: ./.github/workflows/workflow-pages.yml
        with:
            pyver: '3.11'
            os: ubuntu-latest
    deploy:
        needs: [call-pages]
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - uses: actions/setup-python@v7
            with:
                python-version: '3.11'
          - uses: actions/download-artifact@v8
            with:
                name: public-ubuntu-latest-3.11
                path: public/main
          - uses: peaceiris/actions-gh-pages@v3
            with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./public
                keep_files: true
